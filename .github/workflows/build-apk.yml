name: Build Bricko for Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap sync android
      - name: Build the app
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Bricko.apk"
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.${{ github.run_number }}
          name: Bricko for Android 1.8 (build ${{ github.run_number }})
          body: |
            Download **Bricko.apk** on your Android phone and open it to install.
            The first time, Android asks you to allow installing apps from your browser or Files app.
          files: Bricko.apk
          make_latest: true
